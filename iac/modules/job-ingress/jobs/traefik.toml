[accessLog]

[api]
  dashboard = true
  insecure = false

[entryPoints]
  [entryPoints.web]
    address = ":${ingress_port}"
  [entryPoints.websecure]
    address = ":${ingress_tls_port}"
%{ if acme_email != "" }
    [entryPoints.websecure.http.tls]
      certResolver = "letsencrypt"
%{ if hcloud_token != "" }
    # With hcloud DNS-01 we can issue ONE wildcard cert that covers every
    # subdomain (sandbox URLs like 49983-<id>.DOMAIN included). The SAN list
    # is (apex + wildcard) — Traefik requests it eagerly at startup.
    [[entryPoints.websecure.http.tls.domains]]
      main = "${domain_name}"
      sans = ["*.${domain_name}"]
%{ else }
    # No hcloud token → fall back to HTTP-01 which can't issue wildcards, so
    # pre-issue only the well-known subdomains. Sandbox URLs will hit
    # Traefik's default self-signed cert (clients need TLS-skip).
    [[entryPoints.websecure.http.tls.domains]]
      main = "api.${domain_name}"
    [[entryPoints.websecure.http.tls.domains]]
      main = "nomad.${domain_name}"
%{ endif }
%{ endif }
  [entryPoints.traefik]
    address = ":${control_port}"

[metrics]
  [metrics.otlp]
    [metrics.otlp.grpc]
      endpoint = "${otel_collector_grpc_endpoint}"
      insecure = true

[ping]
  entryPoint = "web"

[providers]
  [providers.consulCatalog]
    exposedByDefault = false
    [providers.consulCatalog.endpoint]
      address = "${consul_endpoint}"
      token = "${consul_token}"
  [providers.file]
    directory = "/local/config"
    watch = false
  [providers.nomad]
    exposedByDefault = false
    [providers.nomad.endpoint]
      address = "${nomad_endpoint}"
      token = "${nomad_token}"

%{ if acme_email != "" }
# Let's Encrypt resolver. When an hcloud DNS token is provided we use the
# DNS-01 challenge (via an exec script that talks to the Hetzner Cloud DNS
# API) because it's the only way to issue a wildcard cert for dynamic sandbox
# subdomains. Without the token we fall back to HTTP-01, which can only cover
# explicit Host()-ruled domains.
[certificatesResolvers.letsencrypt.acme]
  email = "${acme_email}"
  storage = "/local/acme.json"
%{ if hcloud_token != "" }
  [certificatesResolvers.letsencrypt.acme.dnsChallenge]
    provider = "exec"
    # Give the Hetzner Cloud DNS a chance to propagate before lego polls.
    delayBeforeCheck = 15
%{ else }
  [certificatesResolvers.letsencrypt.acme.httpChallenge]
    entryPoint = "web"
%{ endif }
%{ endif }
